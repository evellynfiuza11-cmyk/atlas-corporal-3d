<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Corporal | Tour 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee8da;color:#40392e;font-family:Arial,sans-serif}
header{padding:18px 20px;background:#f5efe3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:4px;color:#59664b}
small{display:block;font-size:10px;letter-spacing:2px;margin-top:5px;color:#837a69}
button{background:#f7f1e5;border:1px solid #b8aa89;border-radius:30px;padding:11px 16px;color:#4b493b;cursor:pointer}
button:hover{background:#697454;color:white}
#stage{height:70vh;min-height:420px;margin:12px;border-radius:20px;overflow:hidden;position:relative;background:#e8e0d0}
#stage canvas{width:100%;height:100%;display:block}
#hint{position:absolute;top:15px;left:15px;background:#f7f1e5dd;padding:10px 14px;border-radius:12px;font-size:12px}
#controls{position:absolute;bottom:15px;right:15px;display:grid;grid-template-columns:repeat(3,48px);gap:5px}
#controls button{padding:12px 5px;border-radius:12px}
#rooms{padding:8px 12px 25px;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.room{padding:15px;border-radius:14px;background:#f8f2e7;border:1px solid #d5c8ac;text-align:left}
.room b{display:block;margin-bottom:5px}
.room span{font-size:12px;color:#887d6b}
</style>
</head>
<body>

<header>
<div class="brand">ATLAS CORPORAL<small>CLÍNICA DE ESTÉTICA · TOUR VIRTUAL</small></div>
<div>
<button onclick="walk()">Caminhar</button>
<button onclick="aerial()">Vista aérea</button>
<button onclick="showAll()">Mostrar clínica</button>
</div>
</header>

<div id="stage">
<div id="hint">Arraste a tela para olhar ao redor · Use WASD ou as setas para caminhar</div>
<div id="controls">
<button onclick="move(0,-1)">↑</button>
<button onclick="turn(-1)">↶</button>
<button onclick="move(0,1)">↓</button>
<button onclick="move(-1,0)">←</button>
<button onclick="turn(1)">↷</button>
<button onclick="move(1,0)">→</button>
</div>
</div>

<h2 style="padding:0 15px;font-family:Georgia">Explore os ambientes</h2>
<div id="rooms"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const stage=document.querySelector('#stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#e9e1d0');
scene.fog=new THREE.Fog('#e9e1d0',22,40);

const camera=new THREE.PerspectiveCamera(65,stage.clientWidth/stage.clientHeight,.1,100);
camera.position.set(0,1.65,7);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
stage.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight('#fff8e9','#8c846f',2));
const light=new THREE.DirectionalLight('#fff3dc',3);
light.position.set(5,10,7);
light.castShadow=true;
scene.add(light);

const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.78});
const cream=mat('#eee5d4'), olive=mat('#788267'), darkOlive=mat('#58634c');
const wood=mat('#a98258'), lightWood=mat('#c6a47a');
const white=mat('#f8f4ec'), gray=mat('#c5c1b9');
const green=mat('#557451'), black=mat('#443e35');

function box(x,y,z,w,h,d,m,shadow=true){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);
 o.castShadow=shadow;
 o.receiveShadow=true;
 scene.add(o);
 return o;
}
function plant(x,z){
 box(x,.22,z,.38,.44,.38,wood);
 const leaves= new THREE.Group();
 for(let i=0;i<7;i++){
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(.16,.12,8),green);
  leaf.scale.set(.7,2.3,.7);
  leaf.position.set(Math.sin(i)*.15,.55+Math.random()*.35,Math.cos(i)*.15);
  leaves.add(leaf);
 }
 leaves.position.set(x,0,z);scene.add(leaves);
}
function bed(x,z){
 box(x,.25,z,1.45,.25,2.05,white);
 box(x,.4,z,1.3,.18,1.8,white);
 box(x,.54,z-.72,.65,.22,.4,white);
 box(x,.16,z,1.6,.16,2.15,wood);
 box(x,.75,z,1.48,.08,2.05,white);
}
function desk(x,z){
 box(x,.78,z,1.8,.12,.8,wood);
 for(let dx of [-.7,.7])box(x+dx,.38,z,.08,.72,.08,black);
}
function cabinet(x,z){
 box(x,.65,z,1.5,1.3,.45,lightWood);
 for(let i=0;i<3;i++)box(x,.25+i*.4,z-.24,1.35,.025,.02,wood);
}
function sofa(x,z){
 box(x,.42,z,2,.45,.8,olive);
 box(x,.72,z-.35,2,.5,.18,olive);
 for(let dx of [-.85,.85])box(x+dx,.65,z, .25,.45,.8,olive);
}
function walls(){
 // Floor
 box(0,-.12,0,18,.22,13,cream);
 // Outer walls
 box(-9,1.5,0,.22,3,13,cream);
 box(9,1.5,0,.22,3,13,cream);
 box(0,1.5,-6.5,18,3,.22,cream);
 box(-5.8,1.5,6.5,6.4,3,.22,cream);
 box(5.8,1.5,6.5,6.4,3,.22,cream);
 // Interior partitions
 box(-2.3,1.5,-2.1,.16,3,4.2,cream);
 box(2.2,1.5,-2.1,.16,3,4.2,cream);
 box(-5.5,1.5,0,4.8,3,.16,cream);
 box(5.5,1.5,0,4.8,3,.16,cream);
 box(0,1.5,-4.5,5.4,3,.16,cream);
 box(0,1.5,2.6,5.4,3,.16,cream);
 // Olive accent walls
 box(-6.1,1.5,-6.35,5.7,3,.06,olive);
 box(0,1.5,-6.35,5.7,3,.06,olive);
 // Wall decor
 box(-6.1,1.95,-6.28,2.1,1.05,.06,wood);
 box(-6.1,1.95,-6.22,1.9,.85,.04,cream);
}
walls();

// Reception
desk(-6.3,4.8);
sofa(-6.2,2.1);
plant(-8,4.5);
plant(-8,1.5);
box(-6.3,1.1,-6.22,2,.12,.06,wood);

// Treatment rooms
bed(-5.2,-3.9); cabinet(-7.3,-5.2); plant(-3.2,-5.2);
bed(-5.2,-.4); cabinet(-7.3,.8); plant(-3.2,.8);
bed(5.2,-3.9); cabinet(7.3,-5.2); plant(3.2,-5.2);
bed(5.2,-.4); cabinet(7.3,.8); plant(3.2,.8);

// Evaluation room
desk(-1,4.5);
box(-1,1.1,4.5,1.2,.12,.8,lightWood);
sofa(1,4.3);

// Decor and details
plant(8,4.5); plant(8,1.5);
cabinet(0,-5.3);
box(0,2.95,0,17.8,.1,12.8,white,false);

// Navigation
let yaw=0,pitch=0,mode='walk';
function look(){
 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
}
function walk(){
 mode='walk';
 camera.position.set(0,1.65,7);
 yaw=0;pitch=0;look();
}
function aerial(){
 mode='aerial';
 camera.position.set(0,17,12);
 camera.lookAt(0,0,0);
}
function showAll(){aerial();}
function move(x,z){
 if(mode!=='walk')walk();
 const dir=new THREE.Vector3(x,0,z).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 camera.position.addScaledVector(dir,.55);
 camera.position.x=Math.max(-8,Math.min(8,camera.position.x));
 camera.position.z=Math.max(-5.8,Math.min(5.8,camera.position.z));
}
function turn(n){yaw+=n*.18;look();}
window.move=move;window.turn=turn;
window.walk=walk;window.aerial=aerial;window.showAll=showAll;

// Keyboard movement
window.addEventListener('keydown',e=>{
 if(mode!=='walk')walk();
 const k=e.key.toLowerCase();
 if(k==='w'||k==='arrowup')move(0,-1);
 if(k==='s'||k==='arrowdown')move(0,1);
 if(k==='a'||k==='arrowleft')turn(-1);
 if(k==='d'||k==='arrowright')turn(1);
});

// Drag to look
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(!dragging||mode!=='walk')return;
 yaw-=(e.clientX-lastX)*.004;
 pitch-=(e.clientY-lastY)*.004;
 pitch=Math.max(-1,Math.min(1,pitch));
 lastX=e.clientX;lastY=e.clientY;look();
});

const roomList=[
 ['Recepção','Balcão, espera e acolhimento',-6.3,4.8],
 ['Sala de avaliação','Consulta e avaliação',0,4.5],
 ['Atendimento 1','Sala de procedimentos',-5.2,-3.9],
 ['Atendimento 2','Sala de procedimentos',-5.2,-.4],
 ['Atendimento 3','Sala de procedimentos',5.2,-3.9],
 ['Copa','Área de descanso',0,-5.3],
 ['Armazenamento','Materiais e insumos',7.3,.8],
 ['DML','Materiais de limpeza',7.3,-5.2],
 ['Banheiro PNE','Acessível',7.2,3.8],
 ['Banheiro feminino','Sanitário',5.2,2],
 ['Banheiro masculino','Sanitário',-5.2,2],
 ['Despensa','Estoque de apoio',0,-5.3],
 ['Resíduos','Abrigo de resíduos',7.3,-5.2],
 ['Banheiro funcionários','Sanitário de apoio',-7.3,.8]
];

const rooms=document.querySelector('#rooms');
roomList.forEach(([name,desc,x,z])=>{
 const b=document.createElement('button');
 b.className='room';
 b.innerHTML=`<b>${name}</b><span>${desc}</span>`;
 b.onclick=()=>{
  mode='walk';
  camera.position.set(x,1.65,z+1.3);
  yaw=0;pitch=0;look();
 };
 rooms.appendChild(b);
});

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=stage.clientWidth/stage.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(stage.clientWidth,stage.clientHeight);
});
</script>
</body>
</html>
